<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>System under maintenance</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        main {
            width: min(100%, 460px);
            padding: 36px 28px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #fff;
            box-shadow: 0 14px 40px rgba(15, 23, 42, .08);
        }
        .icon { color: #2563eb; font-size: 38px; }
        h1 { margin: 16px 0 10px; font-size: 24px; }
        p { margin: 0; color: #64748b; line-height: 1.6; }
        a { display: inline-block; margin-top: 24px; color: #2563eb; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <div class="icon" aria-hidden="true">&#9881;</div>
        <h1>System under maintenance</h1>
        <p>Access is temporarily limited while we perform maintenance. Please try again later.</p>
        <a href="/login">Administrator sign in</a>
    </main>
</body>
</html>
