<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zee Line Risk Solutions insurance agent portal for managing clients, quotations, policies and renewals.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{ site_url }}/">
  <link rel="icon" href="/css/images/favicon.png" type="image/png">
  <title>Zee Line Risk Solutions | Insurance Agent Portal</title>
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #10213d; background: #f5f8fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; grid-template-rows: 1fr auto; }
    main { width: min(100% - 40px, 880px); margin: 0 auto; padding: 72px 0; }
    .brand { color: #1668d8; font-weight: 800; font-size: 15px; letter-spacing: .08em; }
    h1 { max-width: 740px; margin: 22px 0 16px; font-size: clamp(36px, 7vw, 62px); line-height: 1.08; letter-spacing: 0; }
    p { max-width: 650px; color: #4c5d75; font-size: 18px; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
    a.button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 7px; background: #1668d8; color: #fff; font-weight: 700; text-decoration: none; }
    a.button.secondary { background: #e9f1fd; color: #1357b0; }
    footer { width: min(100% - 40px, 880px); margin: 0 auto; padding: 24px 0 32px; color: #64748b; font-size: 14px; }
    footer a { color: #1357b0; margin-right: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="brand">ZEE LINE RISK SOLUTIONS</div>
    <h1>Insurance workflow for agents and their clients.</h1>
    <p>Securely manage insurance clients, prepare quotations, create policies and follow renewals from one agent portal.</p>
    <div class="actions">
      <a class="button" href="/login">Agent sign in</a>
      <a class="button secondary" href="/privacy">Privacy policy</a>
    </div>
  </main>
  <footer>
    <a href="/privacy">Privacy policy</a>
    <a href="/terms">Terms and conditions</a>
  </footer>
</body>
</html>
